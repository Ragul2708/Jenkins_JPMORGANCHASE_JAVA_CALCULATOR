<!DOCTYPE html>
<html>
<head>
    <title>Calculator App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            text-align: center;
        }
        input {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            width: 120px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2> Calculator App </h2>

<input type="number" id="a" placeholder="Enter A">
<input type="number" id="b" placeholder="Enter B">

<br><br>

<button onclick="calculate('add')">Add</button>
<button onclick="calculate('subtract')">Subtract</button>
<button onclick="calculate('multiply')">Multiply</button>
<button onclick="calculate('divide')">Divide</button>

<div id="result"></div>

<script>
    function calculate(operation) {
        const a = document.getElementById('a').value;
        const b = document.getElementById('b').value;

        fetch(`/calculator/${operation}?a=${a}&b=${b}`)
            .then(response => response.text())
            .then(data => {
                document.getElementById('result').innerHTML = "Result: " + data;
            })
            .catch(error => {
                document.getElementById('result').innerHTML = "Error calling API";
            });
    }
</script>

</body>
</html>
